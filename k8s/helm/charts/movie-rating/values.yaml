local:
  enabled: true

otlp:
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

postgresql:
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: movie-rating # Override the default username if you want to use a different one
    password: movie-rating-password # Override the default password if you want to use a different one
    database: movie-rating # Override the default database name if you want to use a different one
  primary:
    networkPolicy:
      enabled: false

app:
  image:
    tag: movie-rating # Override the default image tag if you want to use a different one
    version: latest # Override the default image version if you want to use a different one
  resources:
    requests:
      cpu: 15m # Goldilocks recommendation for 1 replica: 15m
      memory: 225M # Goldilocks recommendation for 1 replica: 15m
      ephemeral-storage: 128Mi
    limits:
      cpu: 200m # Goldilocks recommendation for 1 replica: 15m
      memory: 598M # Goldilocks recommendation for 1 replica: 15m
      ephemeral-storage: 256Mi
  ingress:
    enabled: true
    className: kong
    host: movie-rating.local.com

migrations:
  image:
    tag: movie-rating-migrations
    version: latest
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 2Gi
    limits:
      cpu: 200m
      memory: 128Mi
      ephemeral-storage: 2Gi

secretStore:
  region: null # Required when local.enabled is false — AWS region for SSM Parameter Store
