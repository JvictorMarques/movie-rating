tempo:
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

service:
  type: ClusterIP
  port: 3200
  annotations: {}

extraPorts:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
    protocol: TCP

persistence:
  enabled: false
