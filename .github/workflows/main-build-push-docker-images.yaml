name: Build and Push Docker Images
on:
  push:
    branches:
      - main
    paths:
      - 'app/app.py'
      - 'app/pyproject.toml'
      - 'app/*.lock'
      - 'app/src/**'
      - 'app/tests/**'
      - 'app/alembic.ini'
      - 'app/migrations/**'
      - 'app/Dockerfile'
      - 'app/.dockerignore'

jobs:
  build-and-push:
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-push-docker-images.yaml
    with:
      registry: '["ghcr", "ecr"]'
    secrets:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
