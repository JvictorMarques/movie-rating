name: Terraform CI
on:
  workflow_call:
    secrets:
      AWS_ROLE_TO_ASSUME:
        description: 'AWS Role to assume for Terraform operations'
        required: true

jobs:
  terraform:
    name: Terraform CI
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_LINT_VERSION: v0.62.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6.2.2
        with:
          tflint_version: ${{ env.TF_LINT_VERSION }}

      - name: Run TFLint
        run: tflint --recursive

      - name: Run Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan \
            -no-color \
            -input=false

      - name: Post Terraform plan comment
        uses: actions/github-script@v9.0.0
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

              <details><summary>Show Plan</summary>

              \`\`\`terraform
              ${{ steps.plan.outputs.stdout }}
              \`\`\`

              </details>`
            });
