name: Push image to a Registry
on:
  workflow_call:
    inputs:
      registry:
        description: 'JSON array of registries, e.g. ''["ghcr", "ecr"]'' or ''["ghcr"]'''
        required: true
        type: string

jobs:
  ghcr:
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        targets: [migrations, runtime]
        registry: ${{ fromJson(inputs.registry) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - name: Validate registry input
        run: |
          if [[ "${{ matrix.registry }}" != "ghcr" && "${{ matrix.registry }}" != "ecr" ]]; then
            echo "Invalid registry: ${{ matrix.registry }}. Must be 'ghcr' or 'ecr'."
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: ${{ matrix.registry == 'ecr' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Set image repository
        run: |
          function ghcr_registry() {
            local repo="${{ github.repository }}"
            echo "ghcr.io/$(echo $repo | tr '[:upper:]' '[:lower:]')"
          }
          if [ "${{ matrix.registry }}" = "ecr" ]; then
            echo "REGISTRY=${{ secrets.ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$(echo ${{ github.repository }} | cut -d'/' -f2)" >> $GITHUB_ENV
          else
            echo "REGISTRY=$(ghcr_registry)" >> $GITHUB_ENV
          fi
          echo "CACHE_REGISTRY=$(ghcr_registry)" >> $GITHUB_ENV

      - name: Login to ECR
        if: ${{ matrix.registry == 'ecr' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}

      - name: Set image tag
        run: |
          TAG=$(grep version pyproject.toml | cut -d '=' -f2 | tr -d ' \"')
          if [ "${{ matrix.targets}}" = "migrations" ]; then
            IMAGE_TAG="migrations-$TAG"
            IMAGE_LATEST_TAG="migrations-latest"
          else
            IMAGE_TAG="$TAG"
            IMAGE_LATEST_TAG="latest"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_LATEST_TAG=$IMAGE_LATEST_TAG" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./app
          target: ${{ matrix.targets }}
          push: true
          tags: |
            ${{ env.REGISTRY }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}:${{ env.IMAGE_LATEST_TAG }}
          cache-from: type=registry,ref=${{ env.CACHE_REGISTRY }}:cache-${{ matrix.targets }}
          cache-to: type=registry,ref=${{ env.CACHE_REGISTRY }}:cache-${{ matrix.targets }},mode=max
