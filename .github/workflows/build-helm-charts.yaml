name: Build and Push Helm Charts
on:
  workflow_call:
    inputs:
      registry:
        description: 'JSON array of registries, e.g. ''["ghcr", "ecr"]'' or ''["ghcr"]'''
        required: true
        type: string
    secrets:
      AWS_ROLE_TO_ASSUME:
        description: 'AWS IAM Role ARN to assume for ECR access'
        required: true
      ACCOUNT_ID:
        description: 'AWS Account ID for ECR'
        required: true

concurrency:
  group: 'helm-chart-build-push'
  cancel-in-progress: true

jobs:
  build-push-helm-charts:
    name: ${{ matrix.registry }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        registry: ${{ fromJson(inputs.registry) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: k8s/helm
    env:
      ECR_REGISTRY: ${{ secrets.ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
    steps:
      - uses: actions/checkout@v6

      - name: Validate registry input
        run: |
          if [[ "${{ matrix.registry }}" != "ghcr" && "${{ matrix.registry }}" != "ecr" ]]; then
            echo "Invalid registry: ${{ matrix.registry }}. Must be 'ghcr' or 'ecr'."
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v4.2.0

      - name: Login to GHCR
        if: ${{ matrix.registry == 'ghcr' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Configure AWS credentials
        if: ${{ matrix.registry == 'ecr' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Verify if the repository exists in ECR
        if: ${{ matrix.registry == 'ecr' }}
        run: |
          aws ecr describe-repositories \
            --repository-names helm-chart/$(echo ${{ github.repository }} | cut -d'/' -f2) \
            --no-cli-pager

      - name: Set registry repository
        run: |
          function ghcr_registry() {
            local repo="${{ github.repository }}"
            echo "oci://ghcr.io/helm-chart/$(echo $repo | tr '[:upper:]' '[:lower:]')"
          }

          function ecr_registry() {
            local repo="helm-chart/$(echo ${{ github.repository }} | cut -d'/' -f2)"
            echo "oci://${{ env.ECR_REGISTRY }}/$repo"
          }

          if [ "${{ matrix.registry }}" = "ecr" ]; then
            echo "REGISTRY=$(ecr_registry)" >> $GITHUB_ENV
          else
            echo "REGISTRY=$(ghcr_registry)" >> $GITHUB_ENV
          fi

      - name: Login to ECR
        if: ${{ matrix.registry == 'ecr' }}
        run: |
          aws ecr get-login-password \
            --region ${{ vars.AWS_REGION }} | \
              helm registry login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Add Helm repository
        run: |
            helm repo add bitnami https://charts.bitnami.com/bitnami
            helm repo update

      - name: Package chart
        run: |
          helm dependency update charts/movie-rating
          helm package charts/movie-rating --destination ./packages

      - name: Push chart to registry
        run: |
          helm push ./packages/*.tgz ${{ env.REGISTRY }}
