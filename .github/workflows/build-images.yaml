name: Push image to a Registry
on:
  workflow_dispatch:

jobs:
  ghcr:
    strategy:
      matrix:
        targets: [migrations, runtime]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GHCR repository
        run: echo "REGISTRY=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set image tag
        run: |
          TAG=$(grep version pyproject.toml | cut -d '=' -f2 | tr -d ' \"')
          if [ "${{ matrix.targets}}" = "migrations" ]; then
            IMAGE_TAG="migrations-$TAG"
          else
            IMAGE_TAG="$TAG"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.targets }}
          push: true
          tags: ${{ env.REGISTRY }}:${{ env.IMAGE_TAG }}

  ecr:
    strategy:
      matrix:
        targets: [migrations, runtime]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    env:
      REGISTRY: ${{ secrets.ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Login to ECR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}

      - name: Set image name
        run: echo "APP=$(echo ${{ github.repository }} | cut -d'/' -f2)" >> $GITHUB_ENV

      - name: Set image tag
        run: |
          TAG=$(grep version pyproject.toml | cut -d '=' -f2 | tr -d ' \"')
          if [ "${{ matrix.targets}}" = "migrations" ]; then
            IMAGE_TAG="migrations-$TAG"
          else
            IMAGE_TAG="$TAG"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.targets }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.APP }}:${{ env.IMAGE_TAG }}
