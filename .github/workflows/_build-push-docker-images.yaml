name: Build and Push Docker Images
on:
  workflow_call:
    inputs:
      registry:
        description: 'JSON array of registries, e.g. ''["ghcr", "ecr"]'' or ''["ghcr"]'''
        type: string
        required: true
      ecr_repository_name:
        description: 'Repository name for ECR (without registry prefix), e.g. ''movie-rating'''
        type: string
        required: true
    secrets:
      AWS_ROLE_TO_ASSUME:
        description: 'AWS IAM Role ARN to assume for ECR access'
        required: true
      ACCOUNT_ID:
        description: 'AWS Account ID for ECR'
        required: true
concurrency:
  group: 'docker-image-build-push'
  cancel-in-progress: true

jobs:
  build-push:
    name: Push to ${{ matrix.registry }} target ${{ matrix.targets }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        registry: ${{ fromJson(inputs.registry) }}
        targets: [migrations, runtime]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Validate registry input
        run: |
          if [[ "${{ matrix.registry }}" != "ghcr" && "${{ matrix.registry }}" != "ecr" ]]; then
            echo "Invalid registry: ${{ matrix.registry }}. Must be 'ghcr' or 'ecr'."
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: ${{ matrix.registry == 'ecr' }}
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Verify ECR repository
        if: ${{ matrix.registry == 'ecr' }}
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ inputs.ecr_repository_name }} \
            --no-cli-pager

      - name: Set image repository
        run: |
          function ghcr_registry() {
            local repo="${{ github.repository }}"
            echo "ghcr.io/$(echo $repo | tr '[:upper:]' '[:lower:]')"
          }
          if [ "${{ matrix.registry }}" = "ecr" ]; then
            echo "REGISTRY=${{ secrets.ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ inputs.ecr_repository_name }}" >> $GITHUB_ENV
          else
            echo "REGISTRY=$(ghcr_registry)" >> $GITHUB_ENV
          fi
          echo "CACHE_REGISTRY=$(ghcr_registry)" >> $GITHUB_ENV

      - name: Login to ECR
        if: ${{ matrix.registry == 'ecr' }}
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}

      - name: Set image tag
        run: |
          TAG=$(grep version pyproject.toml | cut -d '=' -f2 | tr -d ' \"')
          if [ "${{ matrix.targets}}" = "migrations" ]; then
            IMAGE_TAG="migrations-$TAG"
            IMAGE_LATEST_TAG="migrations-latest"
          else
            IMAGE_TAG="$TAG"
            IMAGE_LATEST_TAG="latest"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_LATEST_TAG=$IMAGE_LATEST_TAG" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build and push image
        uses: docker/build-push-action@v7.2.0
        with:
          context: ./app
          target: ${{ matrix.targets }}
          push: true
          tags: |
            ${{ env.REGISTRY }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}:${{ env.IMAGE_LATEST_TAG }}
          cache-from: type=registry,ref=${{ env.CACHE_REGISTRY }}:cache-${{ matrix.targets }}
          cache-to: type=registry,ref=${{ env.CACHE_REGISTRY }}:cache-${{ matrix.targets }},mode=max
